name: Packaging repair - titles and thumbnails on published videos

# On long-form the title and the thumbnail are the whole click decision, and
# both can be changed after publishing. The four documentaries out so far:
#
#     The Empire That Ruled a Quarter of the World and Vanished in 30 Years  64
#     Why Rome Actually Fell (It Is Not What You Were Taught)                 6
#     What Happens When You Start Over at 40                                  2
#     The Truth About Motivation Nobody Sells                                 0
#
# Same pipeline, same quality of script. The one that found an audience is the
# one whose title names something countable. So this fixes the packaging of what
# is already published rather than waiting for the next upload.
#
# It also closes a gap: the scheduled run used to default to the "fun" channel
# only, so Rise With Fate and History never had their older documentaries
# retro-fitted at all.

on:
  # The quota resets at midnight Pacific, 07:00 UTC, and the day's uploads run
  # from 10:00 to 01:00. This used to run at 07:20 - first in the queue - so
  # the repairs took their share of a fresh allowance and the uploads got
  # whatever was left. On 8 September two channels posted with the API already
  # unavailable and were only saved by the local ledger.
  #
  # Wrong way round. A repair that does not happen today happens tomorrow; an
  # upload that does not happen is a video that never exists. So this now runs
  # at 05:00, after the last upload of the cycle and before the reset, and
  # spends only what the uploads did not need.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel, or all three"
        required: true
        type: choice
        options: [all, fun, us, history]
        default: all
      mode:
        description: "check = show what would change; apply = do it"
        required: true
        type: choice
        options: [check, apply]
        default: check
      limit:
        description: "Thumbnails to set per channel (they cost API quota)"
        required: false
        default: "4"

concurrency:
  group: packaging
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One channel at a time. The daily quota is a single pool shared by all
      # three channels and every upload, and running these in parallel is how
      # it got drained mid-afternoon before.
      max-parallel: 1
      fail-fast: false
      matrix:
        channel: [fun, us, history]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow numpy

      - name: Skip channels not selected
        id: pick
        run: |
          want="${{ inputs.channel || 'all' }}"
          if [ "$want" = "all" ] || [ "$want" = "${{ matrix.channel }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Retitle published documentaries
        if: steps.pick.outputs.run == 'yes'
        env:
          REFRESH_TOKEN: >-
            ${{ matrix.channel == 'fun' && secrets.YT_REFRESH_TOKEN_MANAGE
             || matrix.channel == 'us'  && secrets.YT_REFRESH_TOKEN_MANAGE_US
             ||                            secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}
          EXPECT_CHANNEL: >-
            ${{ matrix.channel == 'fun' && 'FaRu Fact'
             || matrix.channel == 'us'  && 'Rise With Fate'
             ||   'History That Explains the World' }}
        # A weak title on a published video costs nothing to fix and is the
        # single cheapest thing available, so it runs before the thumbnails.
        run: |
          python tools/retitle.py \
            ${{ inputs.mode == 'check' && '--check' || '--apply' }} || true

      - name: Set thumbnails
        if: steps.pick.outputs.run == 'yes'
        env:
          REFRESH_TOKEN: >-
            ${{ matrix.channel == 'fun' && secrets.YT_REFRESH_TOKEN_MANAGE
             || matrix.channel == 'us'  && secrets.YT_REFRESH_TOKEN_MANAGE_US
             ||                            secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}
          EXPECT_CHANNEL: >-
            ${{ matrix.channel == 'fun' && 'FaRu Fact'
             || matrix.channel == 'us'  && 'Rise With Fate'
             ||   'History That Explains the World' }}
        # A scheduled run carries no inputs, so the defaults have to be the
        # useful ones - otherwise the nightly run would only ever test the
        # permission and never actually set a thumbnail.
        run: |
          python tools/set_thumbnails.py --limit "${{ inputs.limit || '4' }}" \
            ${{ inputs.mode == 'check' && '--check' || '--apply' }}

      - name: Put the documentary link on videos that already have the reach
        if: steps.pick.outputs.run == 'yes'
        env:
          REFRESH_TOKEN: >-
            ${{ matrix.channel == 'fun' && secrets.YT_REFRESH_TOKEN_MANAGE
             || matrix.channel == 'us'  && secrets.YT_REFRESH_TOKEN_MANAGE_US
             ||                            secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}
          EXPECT_CHANNEL: >-
            ${{ matrix.channel == 'fun' && 'FaRu Fact'
             || matrix.channel == 'us'  && 'Rise With Fate'
             ||   'History That Explains the World' }}
        # Highest-view videos first: thirty-nine on the history channel alone
        # have over 150 views and descriptions that point nowhere. That is all
        # the discovery these channels have managed, and it is being spent.
        run: |
          python tools/relink.py ${{ matrix.channel }} --min-views 40 --expect "$EXPECT_CHANNEL"             --limit "${{ inputs.limit || '20' }}"             ${{ inputs.mode == 'check' && '--check' || '--apply' }} || true

      - name: Give every video a next video
        if: steps.pick.outputs.run == 'yes'
        env:
          REFRESH_TOKEN: >-
            ${{ matrix.channel == 'fun' && secrets.YT_REFRESH_TOKEN_MANAGE
             || matrix.channel == 'us'  && secrets.YT_REFRESH_TOKEN_MANAGE_US
             ||                            secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}
          EXPECT_CHANNEL: >-
            ${{ matrix.channel == 'fun' && 'FaRu Fact'
             || matrix.channel == 'us'  && 'Rise With Fate'
             ||   'History That Explains the World' }}
        # 514 published videos across three channels and one playlist between
        # them. Playlists cost no production, they put a next video in front of
        # someone who has already proved they are interested, and playlist watch
        # time counts toward the 4,000 hours that open the Partner Programme.
        run: |
          python tools/playlists.py --limit 25 --expect "$EXPECT_CHANNEL" ${{ inputs.mode == 'check' && '--check' || '--apply' }} || true

      - name: Make the channel page answer who this is for
        if: steps.pick.outputs.run == 'yes'
        env:
          REFRESH_TOKEN: >-
            ${{ matrix.channel == 'fun' && secrets.YT_REFRESH_TOKEN_MANAGE
             || matrix.channel == 'us'  && secrets.YT_REFRESH_TOKEN_MANAGE_US
             ||                            secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}
          EXPECT_CHANNEL: >-
            ${{ matrix.channel == 'fun' && 'FaRu Fact'
             || matrix.channel == 'us'  && 'Rise With Fate'
             ||   'History That Explains the World' }}
        # FaRu Fact's description is empty, which is not only a page that says
        # nothing - it is the text YouTube reads to decide who to suggest the
        # channel to. Runs after the playlists step so the sections it features
        # already exist.
        run: |
          python tools/branding.py ${{ matrix.channel }} --expect "$EXPECT_CHANNEL" ${{ inputs.mode == 'check' && '--check' || '--apply' }} || true

      - name: Ask the question on videos that already have an audience
        if: steps.pick.outputs.run == 'yes'
        env:
          REFRESH_TOKEN: >-
            ${{ matrix.channel == 'fun' && secrets.YT_REFRESH_TOKEN_MANAGE
             || matrix.channel == 'us'  && secrets.YT_REFRESH_TOKEN_MANAGE_US
             ||                            secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}
          EXPECT_CHANNEL: >-
            ${{ matrix.channel == 'fun' && 'FaRu Fact'
             || matrix.channel == 'us'  && 'Rise With Fate'
             ||   'History That Explains the World' }}
          OWNER_GEMINI_KEY: ${{ secrets.OWNER_GEMINI_KEY }}
          GEMINI_REQUEST_BUDGET: "3"
        # Four history videos carry nearly four thousand views between them and
        # not one comment, because nobody was ever asked anything. Six a day,
        # each question written for its own video - a template across thirty-nine
        # videos is the mass-produced pattern the policy is aimed at.
        run: |
          python tools/seed_comments.py ${{ matrix.channel }} --limit 6 --min-views 200 --expect "$EXPECT_CHANNEL" ${{ inputs.mode == 'check' && '--check' || '--apply' }} || true
