name: Expand short scripts past the 30 second floor

# The publisher now refuses anything under 78 spoken words, because Fatema's
# requirement is that no video runs under thirty seconds. Applying that rule
# left the banks with 1, 15 and 6 usable scripts against thirty videos a day -
# every channel would have gone silent inside a day.
#
# The existing scripts are not bad, they are short. This rewrites them longer
# instead of generating replacements: eight per request rather than one, so a
# single run repairs a few hundred, and the channels keep the subjects they
# already rank for.
#
# Runs four times a day while the banks are still short. Each run spends a fixed
# slice of the free Gemini quota, because the live app answers customers with
# the same key.

on:
  # No schedule. Removed 2026-11-13.
  #
  # This file's whole job is "rewrite each of these scripts LONGER", and the
  # measurement that landed today says longer is the losing direction: at a
  # matched video age, 21-30s takes 36 views, 31-40s takes 32, 41-50s takes 21,
  # and on the 49 days a channel published both lengths the short one won on 35
  # of them. The band is now 60-78 spoken words, so the only scripts this still
  # has any business touching are the ones under 60.
  #
  # And it was the reason the refill got nothing. Gemini's free tier is one
  # pool. On 13 November expand ran at 10:52 and committed its rewrites; the
  # refill ran at 12:52 and every call came back 429 or 503 on all four models:
  #
  #     fun: 1065 unused of 1200 written (135 published), growing to 1200
  #     TOTAL ADDED 0 (budget 45 requests)
  #
  # grow.py last wrote a new script on 10 November. Writing new scripts to the
  # measured band, with titles that are searches people actually type, is worth
  # more than lengthening old ones - so the quota goes there, and this runs by
  # hand when it is wanted.
  workflow_dispatch:
    inputs:
      channels:
        description: "Which channels (space separated), blank for all three"
        required: false
        default: ""
      limit:
        description: "Most scripts to repair per channel"
        required: false
        default: "400"
      budget:
        description: "Gemini requests to spend (shared with the live app)"
        required: false
        default: "45"

concurrency:
  group: script-banks        # never write the banks at the same time as refill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rewrite the short scripts longer
        env:
          OWNER_GEMINI_KEY: ${{ secrets.OWNER_GEMINI_KEY }}
          GEMINI_REQUEST_BUDGET: ${{ github.event.inputs.budget || '20' }}
          ONLY: ${{ github.event.inputs.channels }}
          LIMIT: ${{ github.event.inputs.limit || '400' }}
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"

          # Stop before the job limit so the commit below always runs - a run
          # killed at 120 minutes lost two hours of repaired scripts on 19 Sep.
          timeout 35m python tools/expand.py ${ONLY:-us fun history} --limit "$LIMIT" || echo "::warning::expand failed - this run carried on without it"

          git add autopilot_*/scripts_*.json
          if git diff --cached --quiet; then
            echo "nothing repaired this run"
          else
            git commit -m "banks: rewrite short scripts past the 30s floor [skip ci]"
            # a posting run commits its ledger to the same branch
            pushed=0
            for i in 1 2 3 4 5; do
              # A rebase that hits a conflict stops half-done and leaves
              # unmerged files, so every later attempt dies with "pulling is
              # not possible" rather than retrying anything. That is how
              # History's and Rise's analytics silently stopped landing while
              # the run stayed green - growth and insights both write
              # analytics/ and both ran at 12:51.
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              if git pull --rebase --autostash origin main && git push origin main; then
                pushed=1
                break
              fi
              sleep $((5 * i))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::the data was measured but never reached the repo - everything downstream is now reading stale numbers"
              exit 1
            fi
          fi

      - name: How many scripts can actually be published
        if: always()
        run: |
          python - <<'PY'
          import json
          for k in ("us", "fun", "history"):
              bank = json.load(open("autopilot_%s/scripts_%s.json" % (k, k), encoding="utf-8"))
              ok = sum(1 for d in bank
                       if len(d.get("phrases") or []) >= 10
                       and sum(len((p or "").replace("\n", " ").split())
                               for p in d["phrases"]) >= 78)
              print("%-8s %4d in bank, %4d clear the 30s floor -> %.1f days at 10/day"
                    % (k, len(bank), ok, ok / 10.0))
          PY
