name: Rise Daily (US) auto-post

on:
  schedule:
    # Five a day. Cut to three on 8 September when there were not enough
    # scripts that cleared the thirty-second floor, and the 28-day views fell
    # 15% in the days after (28,539 -> 24,127). Rise is the best subscriber
    # converter of the three - 4.45 per thousand views, 86% retention - so on
    # this channel volume is subscribers. With 25 publishable scripts banked
    # and the expander repairing whichever channel is shortest first, five a
    # day is sustainable. FaRu and History stay at three.
    - cron: "0 10 * * *"   # 6am ET
    - cron: "0 13 * * *"   # 9am ET
    - cron: "0 17 * * *"   # moved by growth/schedule.py on 2026-09-15: 16 UTC measured 42 views against 17 at 118.0
    - cron: "0 21 * * *"   # 5pm ET
    - cron: "0 0 * * *"    # 8pm ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not upload"
        required: false
        default: "false"
      count:
        description: "How many different videos to make/upload this run"
        required: false
        default: "2"

concurrency:
  group: rise-daily-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet edge-tts pillow

      - name: Generate + upload motivation Short
        working-directory: autopilot_us
        env:
          YT_REFRESH_TOKEN_US: ${{ secrets.YT_REFRESH_TOKEN_US }}
          YT_PRIVACY: public
          YT_REFRESH_TOKEN_CAPTIONS: ${{ secrets.YT_REFRESH_TOKEN_MANAGE_US }}   # force-ssl: subtitles
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          RUNS_PER_DAY: "5"
        run: python main_us.py

      # The ledger is how a repeat is prevented when the shared API quota runs
      # out and the channel cannot be read. It only works if it survives the
      # run, so it is committed back.
      - name: Record what was published
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add autopilot_*/published_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          git commit -m "ledger: record published titles [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --quiet origin main && git push --quiet origin main && exit 0
            sleep 7
          done
          echo "could not push the ledger"

      - name: Release the post pack (TikTok / Reels files)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(autopilot_us/_work/pack/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing packed this run"
            exit 0
          fi
          tag="pack-us-$(date -u +%Y%m%d-%H%M%S)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" "${files[@]}" \
            --title "Rise With Fate Shorts - $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "Vertical videos with their captions, ready to post to TikTok, Instagram Reels and Facebook Reels. Same videos as the YouTube uploads from this run."

      - name: Cross-post to Instagram and Facebook Reels
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ -z "$IG_USER_ID" ] && [ -z "$FB_PAGE_ID" ]; then
            echo "no Instagram or Facebook credentials set - skipping"
            exit 0
          fi
          shopt -s nullglob
          for mp4 in autopilot_us/_work/pack/*.mp4; do
            base="${mp4%.mp4}"
            name="$(basename "$mp4")"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
            python tools/crosspost_meta.py --video-url "$url" --caption-file "$base.txt" || true
          done

      - name: Keep the dry-run video to inspect
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-short
          path: autopilot_us/_work/final.mp4
          if-no-files-found: warn
          retention-days: 3
