name: Rise Daily (US) auto-post

on:
  schedule:
    # Five a day. Cut to three on 8 September when there were not enough
    # scripts that cleared the thirty-second floor, and the 28-day views fell
    # 15% in the days after (28,539 -> 24,127). Rise is the best subscriber
    # converter of the three - 4.45 per thousand views, 86% retention - so on
    # this channel volume is subscribers. With 25 publishable scripts banked
    # and the expander repairing whichever channel is shortest first, five a
    # day is sustainable. FaRu and History stay at three.
    # Three a day, not five, from 2026-10-15. Rise takes a median of 8
    # views a Short against History's 228, and the feed has picked up
    # none of its last 135. The two slots went to History. This is not
    # abandonment - the 28-second length change landed on 14 October
    # and has not been measured yet; it keeps three slots to measure on.
    # Balanced 1 November. Measured at a matched video age, the three
    # channels are not distinguishable: 28-day medians 29/16/24 and
    # 14-day 14/34/21 - the windows disagree about every one and the
    # quartile spreads overlap almost completely. The 6/2/6 split this
    # replaces was set from a one-week reading that reversed, as the two
    # before it did. tools/allocate.py decides from here, and it only
    # moves a slot when a channel wins on BOTH windows by half again
    # with 20 videos behind each number.
    # Cut to two on 2 November, for the same reason as FaRu Fact and
    # History: more uploads a day divides this channel's reach rather
    # than adding to it. Rise's own numbers are noisier than theirs -
    # 2 a day measured 32 against 9 at five a day - but the direction
    # is the same on every channel that has enough data.
    - cron: "0 10 * * *"   # 6am ET
    - cron: "0 17 * * *"   # moved by growth/schedule.py on 2026-09-15: 16 UTC measured 42 views against 17 at 118.0
    # Raised to ten a day per channel on 2026-11-24. Ten each is the count
    # the YouTube quota was measured to take; the channels were at two,
    # four and six. The cut to those numbers was made on a prediction of
    # 3.9x more reach per video, and that prediction came back 0.9x - so
    # volume did not divide reach, it simply did nothing, and the videos
    # that were not published were views that were not taken.
    - cron: "0 0 * * *"
    - cron: "0 2 * * *"
    - cron: "0 5 * * *"
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
    - cron: "0 14 * * *"
    - cron: "0 19 * * *"
    - cron: "0 21 * * *"
    # The 21 UTC slot moved to FaRu Fact on 18 October. Rise measures 6.0
    # views a day per video against FaRu's 36.0, and two slots are still
    # enough to keep measuring the 28-second change, which is working.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not upload"
        required: false
        default: "false"
      count:
        description: "How many different videos to make/upload this run"
        required: false
        default: "2"

concurrency:
  group: rise-daily-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet edge-tts pillow piper-tts

      # Ten a day is a number of videos, not a list of cron times. A newly
      # added schedule is skipped by GitHub for a day or more every time one
      # is added here, and a free-tier cron can queue hours late or not fire
      # at all - silently, because the workflow simply does not start. This
      # asks what the channel has actually published since midnight UTC and
      # takes up to three of whatever is still owed, so a missed slot is made
      # up rather than lost. The cap is what stops an unreadable channel or a
      # genuinely missed day from putting ten videos out in one hour.
      - name: How many are still owed today
        id: owed
        env:
          YT_REFRESH_TOKEN_US: ${{ secrets.YT_REFRESH_TOKEN_US }}
        run: |
          out=$(python tools/remaining_today.py --key us --target 10 --cap 3)
          n=$(echo "$out" | sed -n 1p)
          done_today=$(echo "$out" | sed -n 2p)
          echo "n=${n:-1}" >> "$GITHUB_OUTPUT"
          echo "done=${done_today:-0}" >> "$GITHUB_OUTPUT"

      - name: Generate + upload motivation Short
        if: ${{ github.event.inputs.count || steps.owed.outputs.n != '0' }}
        working-directory: autopilot_us
        env:
          YT_REFRESH_TOKEN_US: ${{ secrets.YT_REFRESH_TOKEN_US }}
          YT_PRIVACY: public
          YT_REFRESH_TOKEN_CAPTIONS: ${{ secrets.YT_REFRESH_TOKEN_MANAGE_US }}   # force-ssl: subtitles
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          COUNT: ${{ github.event.inputs.count || steps.owed.outputs.n }}
          # Subtitles are the second call on a shared quota. The first
          # few videos of the day get them; after that the units go to
          # the next upload instead of a 403.
          PUBLISHED_TODAY: ${{ steps.owed.outputs.done }}
          CAPTION_BUDGET: "3"
          RUNS_PER_DAY: "5"
        run: python main_us.py

      # The ledger is how a repeat is prevented when the shared API quota runs
      # out and the channel cannot be read. It only works if it survives the
      # run, so it is committed back.
      - name: Record what was published
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          # The subscribe-placement arms too. record_arm() writes them on the
          # runner and printed "subscribe test: early arm" for eight days
          # while nothing committed them, so the test had no record of a
          # single video and the report kept saying "nothing assigned yet".
          git add autopilot_*/published_*.json analytics/ab_subscribe_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          git commit -m "ledger: record published titles [skip ci]"
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true; git merge --abort 2>/dev/null || true; git pull --rebase --autostash --quiet origin main && git push --quiet origin main && exit 0
            sleep 7
          done
          echo "could not push the ledger"

      - name: Release the post pack (TikTok / Reels files)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(autopilot_us/_work/pack/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing packed this run"
            exit 0
          fi
          tag="pack-us-$(date -u +%Y%m%d-%H%M%S)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" "${files[@]}" \
            --title "Rise With Fate Shorts - $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "Vertical videos with their captions, ready to post to TikTok, Instagram Reels and Facebook Reels. Same videos as the YouTube uploads from this run."

      - name: Cross-post to Instagram and Facebook Reels
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ -z "$IG_USER_ID" ] && [ -z "$FB_PAGE_ID" ]; then
            echo "no Instagram or Facebook credentials set - skipping"
            exit 0
          fi
          shopt -s nullglob
          for mp4 in autopilot_us/_work/pack/*.mp4; do
            base="${mp4%.mp4}"
            name="$(basename "$mp4")"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
            python tools/crosspost_meta.py --video-url "$url" --caption-file "$base.txt" || echo "::warning::crosspost_meta failed - this run carried on without it"
          done

      - name: Keep the dry-run video to inspect
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-short
          path: autopilot_us/_work/final.mp4
          if-no-files-found: warn
          retention-days: 3
