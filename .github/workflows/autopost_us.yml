name: Rise Daily (US) auto-post

on:
  schedule:
    # 5x/day (UTC). Spread across US prime hours: morning, noon, evening ET.
    # Rise With Fate - motivation lands best early. All times are US Eastern.
    - cron: "0 10 * * *"   # 6am ET
    - cron: "0 14 * * *"   # 10am ET
    - cron: "0 17 * * *"   # 1pm ET
    - cron: "0 21 * * *"   # 5pm ET
    - cron: "0 23 * * *"   # 7pm ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not upload"
        required: false
        default: "false"
      count:
        description: "How many different videos to make/upload this run"
        required: false
        default: "1"

concurrency:
  group: rise-daily-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet edge-tts pillow

      - name: Generate + upload motivation Short
        working-directory: autopilot_us
        env:
          YT_REFRESH_TOKEN_US: ${{ secrets.YT_REFRESH_TOKEN_US }}
          YT_PRIVACY: public
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          COUNT: ${{ github.event.inputs.count || '2' }}
        run: python main_us.py
