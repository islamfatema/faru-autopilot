name: Rise Daily (US) auto-post

on:
  schedule:
    # 10 videos a day: 5 runs of 2. Every one is a different script -
    # the rotation is anchored to a fixed origin and the bank grows
    # daily, so nothing repeats. Rise With Fate - motivation, spread over the US waking day.
    - cron: "0 10 * * *"   # 6am ET
    - cron: "0 13 * * *"   # 9am ET
    - cron: "0 16 * * *"   # 12pm ET
    - cron: "0 21 * * *"   # 5pm ET
    - cron: "0 0 * * *"   # 8pm ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not upload"
        required: false
        default: "false"
      count:
        description: "How many different videos to make/upload this run"
        required: false
        default: "2"

concurrency:
  group: rise-daily-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet edge-tts pillow

      - name: Generate + upload motivation Short
        working-directory: autopilot_us
        env:
          YT_REFRESH_TOKEN_US: ${{ secrets.YT_REFRESH_TOKEN_US }}
          YT_PRIVACY: public
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          COUNT: ${{ github.event.inputs.count || '2' }}
          RUNS_PER_DAY: "5"
        run: python main_us.py

      # The ledger is how a repeat is prevented when the shared API quota runs
      # out and the channel cannot be read. It only works if it survives the
      # run, so it is committed back.
      - name: Record what was published
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add autopilot_*/published_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          git commit -m "ledger: record published titles [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --quiet origin main && git push --quiet origin main && exit 0
            sleep 7
          done
          echo "could not push the ledger"
