name: Refill script banks (daily)

# The channels publish 10 videos a day each. If the banks do not grow faster than
# that, the rotation comes back around and the same videos go up again - which is
# what flattened the views before. This keeps every bank well ahead.
#
# Posting never depends on this job. It writes to the banks between runs; if
# Gemini is unavailable the banks simply do not grow that day and the channels
# keep publishing from what they already have.

on:
  schedule:
    # 08:30 UTC, half an hour after the free Gemini tier's daily quota resets
    # at Pacific midnight. It used to run at 05:00, which is late in the
    # *previous* quota day, behind the expander at 03:10 - and on 13 November
    # that is exactly what happened: the expander ran 55 minutes, and every
    # call the refill then made came back 429 or 503 on all four models.
    #
    #   us: 877 unused of 1200 written (323 published), growing to 1200 unused
    #   gemini gemini-2.5-flash: HTTP 429
    #   rate limited, waiting 45s
    #   TOTAL ADDED 0 (budget 45 requests)
    #
    # Writing new scripts to the measured band is worth more than rewriting
    # old short ones, so it now goes first in the quota day and the expander
    # goes last.
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Grow each bank to at least this many scripts"
        required: false
        default: "1200"
      channels:
        description: "Which channels (space separated), blank for all"
        required: false
        default: ""

concurrency:
  # The same group as expand.py. Both read scripts_*.json, change it and write
  # the whole file back, so if they ever ran at the same time the one that
  # finished second would silently erase the other's work. They were in
  # separate groups, which only ever avoided that by luck of the timetable.
  group: script-banks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refill:
    runs-on: ubuntu-latest
    # The free Gemini tier rate limits hard, so a batch takes about a minute of
    # wall clock however little work it is. The first live run needed longer than
    # an hour and was cancelled mid-way.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write new scripts, committing after each channel
        env:
          OWNER_GEMINI_KEY: ${{ secrets.OWNER_GEMINI_KEY }}
          # The live app answers customers with the same free key. Draining the
          # daily quota here once left the app unable to reply to anyone, so this
          # job spends a fixed slice and stops well short of the limit.
          GEMINI_REQUEST_BUDGET: "45"
          TARGET: ${{ github.event.inputs.target || '1200' }}
          ONLY: ${{ github.event.inputs.channels }}
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"

          # One commit per channel. The first live run generated 113 scripts and
          # then hit the job timeout before a single commit at the end could run,
          # so all of them were thrown away. Committing as it goes means a run
          # that dies early still keeps everything it finished.
          for ch in ${ONLY:-us fun history}; do
            echo "::group::$ch"
            python tools/grow.py "$ch" --target "$TARGET" || echo "$ch failed, continuing"
            git add autopilot_*/scripts_*.json
            if git diff --cached --quiet; then
              echo "no new scripts for $ch"
            else
              git commit -m "banks: new scripts for $ch [skip ci]"
              # a posting run may have pushed while this was writing
              for i in 1 2 3; do
                if git rebase --abort 2>/dev/null || true; git merge --abort 2>/dev/null || true; git pull --rebase --autostash --quiet origin main && git push --quiet origin main; then
                  break
                fi
                sleep 5
              done
            fi
            echo "::endgroup::"
          done

      # Last, and deliberately allowed to fail the job: runway.py exits non-zero
      # when a channel is within two weeks of repeating itself. Running it before
      # the commits would have thrown away the very scripts that fix that.
      - name: Report runway
        run: python tools/runway.py
