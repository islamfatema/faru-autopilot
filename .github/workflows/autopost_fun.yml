name: FaRu Facts (English) - Shorts

on:
  schedule:
    # 10 videos a day: 5 runs of 2. Every one is a different script -
    # the rotation is anchored to a fixed origin and the bank grows
    # daily, so nothing repeats. FaRu Facts - facts do well mid-morning and late evening.
    - cron: "0 11 * * *"   # 7am ET
    - cron: "0 17 * * *"   # moved by growth/schedule.py on 2026-09-15: 15 UTC measured 96.5 views against 17 at 178.0
    - cron: "0 22 * * *"   # 6pm ET
  workflow_dispatch:
    inputs:
      count:
        description: "How many fact Shorts to make/upload"
        required: false
        default: "2"
      dry_run:
        description: "Build only, do not upload"
        required: false
        default: "false"

concurrency:
  group: fun-facts-shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install --quiet edge-tts pillow
      - name: Generate + upload fact Shorts
        working-directory: autopilot_fun
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: public
          YT_REFRESH_TOKEN_CAPTIONS: ${{ secrets.YT_REFRESH_TOKEN_MANAGE }}   # force-ssl: subtitles
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          RUNS_PER_DAY: "5"
        run: python main_fun.py

      # A dry run builds a real video and uploads nothing, so keep the file -
      # otherwise the only way to see what a change looks like on screen is to
      # publish it.
      - name: Release the post pack (TikTok / Reels files)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(autopilot_fun/_work/pack/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing packed this run"
            exit 0
          fi
          tag="pack-fun-$(date -u +%Y%m%d-%H%M%S)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" "${files[@]}" \
            --title "FaRu Fact Shorts - $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "Vertical videos with their captions, ready to post to TikTok, Instagram Reels and Facebook Reels. Same videos as the YouTube uploads from this run."

      - name: Cross-post to Instagram and Facebook Reels
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ -z "$IG_USER_ID" ] && [ -z "$FB_PAGE_ID" ]; then
            echo "no Instagram or Facebook credentials set - skipping"
            exit 0
          fi
          shopt -s nullglob
          for mp4 in autopilot_fun/_work/pack/*.mp4; do
            base="${mp4%.mp4}"
            name="$(basename "$mp4")"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
            python tools/crosspost_meta.py --video-url "$url" --caption-file "$base.txt" || true
          done

      - name: Keep the dry-run video to inspect
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-short
          path: autopilot_fun/_work/final.mp4
          if-no-files-found: warn
          retention-days: 3

      # The ledger is how a repeat is prevented when the shared API quota runs
      # out and the channel cannot be read. It only works if it survives the
      # run, so it is committed back.
      - name: Record what was published
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add autopilot_*/published_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          git commit -m "ledger: record published titles [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --quiet origin main && git push --quiet origin main && exit 0
            sleep 7
          done
          echo "could not push the ledger"
