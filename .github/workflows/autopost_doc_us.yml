name: Rise With Fate - long-form documentary (2/week)

# Each run picks the next unused topic from autopilot_us/longform/topics_us.json
# and writes a fresh storyboard for it. The old version alternated between two
# fixed files, so it re-uploaded the same two videos every week - duplicate
# content, which YouTube penalises.

on:
  schedule:
    - cron: "0 13 * * 1" # Mon 9am ET
    - cron: "0 13 * * 5" # Fri 9am ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not publish"
        required: false
        default: "false"
      min_minutes:
        description: "Refuse to publish anything shorter than this"
        required: false
        default: "5"

concurrency:
  group: us-longform
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet edge-tts pillow numpy

      - name: Write this episode from the topic bank
        working-directory: autopilot_us/longform
        env:
          OWNER_GEMINI_KEY: ${{ secrets.OWNER_GEMINI_KEY }}
          MIN_MINUTES: ${{ github.event.inputs.min_minutes || '5' }}
        run: python makeboard.py us _board

      - name: Render documentary (anti-slideshow check enforced)
        working-directory: autopilot_us/longform
        run: python docgen2.py _board/storyboard.json

      - name: Build thumbnail
        working-directory: autopilot_us/longform
        run: python thumb.py _board/thumb.json thumb_out.png

      - name: Publish to YouTube
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: autopilot_us/longform
        env:
          YT_TOKEN_ENV: YT_REFRESH_TOKEN_US
          YT_REFRESH_TOKEN_US: ${{ secrets.YT_REFRESH_TOKEN_US }}
          YT_PRIVACY: public
        run: python publish.py _work2/final_doc.mp4 _board/meta.json thumb_out.png

      - name: Record the documentary so every Short links to it
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add autopilot_us/featured_long.json
          if git diff --cached --quiet; then
            echo "nothing to record"
          else
            git commit -m "featured: newest documentary for the Shorts to link [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase --quiet origin main && git push --quiet origin main; then
                break
              fi
              sleep 5
            done
          fi
