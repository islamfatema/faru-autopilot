name: Write new documentary episodes

# Watch hours are the gate, and the relationship between cadence and hours is
# blunt:
#
#     History Explains   4 documentaries a week   90.7 watch hours / 28 days
#     Rise With Fate     2 a week                 57.4
#     FaRu Fact          2 a week                 19.5
#
# Rise and FaRu should publish four a week too. They cannot, because between
# them they hold twenty-two episodes and nothing in this project wrote new ones
# - grow.py grows the Shorts banks only. This closes that gap so the cadence
# can be raised without a channel running dry mid-month.

on:
  schedule:
    - cron: "30 8 * * *"      # after the bank refill, before the day's uploads
  workflow_dispatch:
    inputs:
      target:
        description: "Grow each topic bank to at least this many episodes"
        required: false
        default: "40"
      channels:
        description: "Which channels (space separated), blank for all"
        required: false
        default: ""

concurrency:
  # Its own group. This writes topics_*.json; expand and refill write
  # scripts_*.json, so they never touch the same file - and sharing a group
  # meant that whenever two of them were queued at once, GitHub cancelled the
  # one that had been waiting longer. Two expand runs died that way.
  group: topic-banks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write episodes
        env:
          OWNER_GEMINI_KEY: ${{ secrets.OWNER_GEMINI_KEY }}
          # Deliberately small. The same key answers customers in the live app,
          # and eight beats per episode is an expensive response.
          GEMINI_REQUEST_BUDGET: "12"
          TARGET: ${{ github.event.inputs.target || '40' }}
          ONLY: ${{ github.event.inputs.channels }}
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          # Episodes built on Shorts this channel has already proved, before
          # any invented ones. The documentary topics are guesses from a
          # brief; the Shorts are measurements. History's Short on Roman lead
          # pipes took 1,043 views and its documentaries take fourteen, and
          # nothing has ever connected the two. These go in marked "lead" so
          # the picker takes them first.
          for ch in ${ONLY:-history us fun}; do
            python tools/proven_topics.py "$ch" --apply --limit 3 || true
          done
          python tools/grow_topics.py ${ONLY:-} --target "$TARGET"
          git add autopilot_*/longform/topics_*.json
          if git diff --cached --quiet; then
            echo "no new episodes this run"
          else
            git commit -m "topics: new documentary episodes [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              # A rebase that hits a conflict stops half-done and leaves
              # unmerged files, so every later attempt dies with "pulling is
              # not possible" rather than retrying anything. That is how
              # History's and Rise's analytics silently stopped landing while
              # the run stayed green - growth and insights both write
              # analytics/ and both ran at 12:51.
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              if git pull --rebase --autostash origin main && git push origin main; then
                pushed=1
                break
              fi
              sleep $((5 * i))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::the data was measured but never reached the repo - everything downstream is now reading stale numbers"
              exit 1
            fi
          fi

      - name: How many weeks of long-form each channel has
        if: always()
        run: |
          python - <<'PY'
          import glob, json, re
          # The cadence comes from each channel's own workflow, not a table.
          # The table said History posts 4 a week; its cron list has said 7
          # since September, so every runway it printed was nearly twice the
          # truth. And it counted published topics as if they were available.
          WF = {"autopilot_us": "autopost_doc_us.yml",
                "autopilot_fun": "autopost_doc_fun.yml",
                "autopilot_history": "autopost_doc.yml"}
          for d, wf in WF.items():
              try:
                  per = len(re.findall(r"- cron:",
                        open(".github/workflows/" + wf, encoding="utf-8").read()))
              except Exception:
                  per = 0
              topics = []
              for f in glob.glob(d + "/longform/topics*.json"):
                  topics += json.load(open(f, encoding="utf-8"))
              try:
                  done = set(t.lower().strip() for t in json.load(
                      open(d + "/longform/published_docs.json", encoding="utf-8")))
              except Exception:
                  done = set()
              left = [t for t in topics
                      if (t.get("title") or "").lower().strip() not in done]
              weeks = (len(left) / float(per)) if per else float("inf")
              flag = "  <-- REFILL" if weeks < 4 else ""
              print("%-20s %3d in bank | %3d left | %d a week -> %.1f weeks%s"
                    % (d, len(topics), len(left), per, weeks, flag))
          PY
