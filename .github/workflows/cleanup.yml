name: Channel cleanup (report / repair)

# Reports the damage the old rotation left on a channel - duplicate uploads,
# descriptions pointing at the wrong channel, stray Bangla videos - and repairs
# it when asked. Reports by default; `apply` has to be turned on deliberately.
#
# Nothing is ever deleted. Duplicates are set to private, so any mistake here is
# reversible from YouTube Studio.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel"
        required: true
        type: choice
        options: [fun, history, us]
        default: fun
      apply:
        description: "Make the changes (leave false to only report)"
        required: false
        type: boolean
        default: false

concurrency:
  group: channel-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect and repair
        env:
          # Repairing a channel means editing videos that are already published,
          # which the posting tokens cannot do - they carry youtube.upload only.
          # YT_REFRESH_TOKEN_MANAGE is granted separately via
          # /api/yt-auth?manage=1 and is the only one with the editing scope.
          # It currently covers FaRu Fact; the other channels need their own.
          # Repairing needs the editing scope, granted per channel via
          # /api/yt-auth?manage=1. Where a MANAGE token exists it is used; the
          # posting token is only enough to produce the report, not to apply it.
          REFRESH_TOKEN: >-
            ${{ inputs.channel == 'fun' && secrets.YT_REFRESH_TOKEN_MANAGE
             || inputs.channel == 'us'  && secrets.YT_REFRESH_TOKEN_MANAGE_US
             ||                            secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}
        run: |
          if [ "${{ inputs.channel }}" = "fun" ]; then
            WRONG="Subscribe to History That Explains the World"
            RIGHT="Subscribe to FaRu Fact for a surprising true fact every day."
          else
            # the other two already name themselves correctly; only duplicates
            # and stray Bangla are worth acting on there
            WRONG="__none__"
            RIGHT="__none__"
          fi
          # 60 writes a run. The uploads draw on the same daily YouTube quota,
          # and a 300 change repair exhausted it today - 41 of History's
          # duplicates were left unhidden and the night's posting was one run
          # away from failing too. A repair that takes a few days is fine;
          # stopping the channels is not.
          python tools/channel_cleanup.py \
            --wrong-cta "$WRONG" --right-cta "$RIGHT" --max-writes 60 \
            ${{ inputs.apply && '--apply' || '' }}
