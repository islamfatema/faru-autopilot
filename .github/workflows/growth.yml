name: Growth loop - collect, diagnose, learn, apply

# The loop Fatema asked for, once a day, per channel:
#
#   collect    every video's real numbers into analytics/videos_<key>.json
#   diagnose   each video against that channel's own baseline, and say WHY it
#              failed - no distribution, weak hook, weak subscribe, weak
#              comments, weak shares - or that it won
#   learn      turn those verdicts into a playbook of patterns that work and
#              patterns that do not, per channel
#   apply      write the weights the posting machines read, so the next upload
#              is chosen by what the data says rather than by what was next
#
# It commits the data it collects. That history is the point: a snapshot cannot
# tell whether the channel's normal is moving.

on:
  schedule:
    - cron: "40 7 * * *"    # after the 07:00 UTC quota reset, before the day's uploads
  workflow_dispatch:
    inputs:
      days:
        description: "Measurement window in days"
        required: false
        default: "28"
      channel:
        description: "fun | us | history | all"
        required: false
        default: "all"

concurrency:
  group: growth
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One channel at a time: the analytics quota and the Data API quota are
      # both single pools shared by all three.
      max-parallel: 1
      fail-fast: false
      matrix:
        channel: [fun, us, history]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip channels not selected
        id: pick
        run: |
          want="${{ inputs.channel || 'all' }}"
          if [ "$want" = "all" ] || [ "$want" = "${{ matrix.channel }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect real per-video analytics
        if: steps.pick.outputs.run == 'yes'
        env:
          REFRESH_TOKEN: >-
            ${{ matrix.channel == 'fun' && secrets.YT_REFRESH_TOKEN_MANAGE
             || matrix.channel == 'us'  && secrets.YT_REFRESH_TOKEN_MANAGE_US
             ||                            secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}
          EXPECT_CHANNEL: >-
            ${{ matrix.channel == 'fun' && 'FaRu Fact'
             || matrix.channel == 'us'  && 'Rise With Fate'
             ||   'History That Explains the World' }}
        run: |
          python growth/collect.py --key ${{ matrix.channel }} \
            --days ${{ inputs.days || '28' }} --retention 12

      - name: Subscriber scorecard - gained, lost, and the monetisation gap
        if: steps.pick.outputs.run == 'yes'
        env:
          REFRESH_TOKEN: >-
            ${{ matrix.channel == 'fun' && secrets.YT_REFRESH_TOKEN_MANAGE
             || matrix.channel == 'us'  && secrets.YT_REFRESH_TOKEN_MANAGE_US
             ||                            secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}
          EXPECT_CHANNEL: >-
            ${{ matrix.channel == 'fun' && 'FaRu Fact'
             || matrix.channel == 'us'  && 'Rise With Fate'
             ||   'History That Explains the World' }}
        run: python growth/subscribers.py --key ${{ matrix.channel }}

      - name: Diagnose every video against this channel's baseline
        if: steps.pick.outputs.run == 'yes'
        run: python growth/diagnose.py --key ${{ matrix.channel }}

      - name: Learn what works on this channel
        if: steps.pick.outputs.run == 'yes'
        run: python growth/playbook.py --key ${{ matrix.channel }}

      - name: Apply what was learned to the posting machine
        if: steps.pick.outputs.run == 'yes'
        run: python growth/apply.py --key ${{ matrix.channel }}

      - name: Turn winners into the next batch
        if: steps.pick.outputs.run == 'yes'
        run: python growth/scale.py --key ${{ matrix.channel }}

      - name: Publish at the hours this channel actually performs
        if: steps.pick.outputs.run == 'yes'
        # One slot moved per run, never more: changing every time at once means
        # the next measurement cannot tell which move did what.
        # --check only: applying rewrites a workflow file, and that push is
        # refused. The proposal is printed and kept for a human to apply.
        run: python growth/schedule.py --key ${{ matrix.channel }}

      - name: Every monetisation requirement, checked not assumed
        if: steps.pick.outputs.run == 'yes'
        env:
          REFRESH_TOKEN: >-
            ${{ matrix.channel == 'fun' && secrets.YT_REFRESH_TOKEN_MANAGE
             || matrix.channel == 'us'  && secrets.YT_REFRESH_TOKEN_MANAGE_US
             ||                            secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}
        run: python growth/eligibility.py --key ${{ matrix.channel }} || echo "::warning::eligibility failed - this run carried on without it"

      - name: Commit the data and the decisions
        if: steps.pick.outputs.run == 'yes'
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          # never stage workflow files: a push from the default token that
          # touches .github/workflows is rejected outright, and it took the
          # analytics with it for twenty days
          git checkout -- .github/workflows 2>/dev/null || true
          git add analytics growth || true
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "growth: ${{ matrix.channel }} measured, diagnosed, learned [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              # A rebase that hits a conflict stops half-done and leaves
              # unmerged files, so every later attempt dies with "pulling is
              # not possible" rather than retrying anything. That is how
              # History's and Rise's analytics silently stopped landing while
              # the run stayed green - growth and insights both write
              # analytics/ and both ran at 12:51.
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              if git pull --rebase --autostash origin main && git push origin main; then
                pushed=1
                break
              fi
              sleep $((5 * i))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::the data was measured but never reached the repo - everything downstream is now reading stale numbers"
              exit 1
            fi
          fi

  # The whole-project reports. These read all three channels and write one
  # file each, so running them inside the matrix made every channel rewrite
  # the same files and the second and third jobs conflicted on every rebase -
  # "CONFLICT (content): Merge conflict in analytics/health.md", every day,
  # which is what kept History's analytics two days stale. Once, after all
  # three are in, from complete data.
  reports:
    needs: growth
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the board
        run: python growth/dashboard.py || echo "::warning::dashboard failed - this run carried on without it"

      - name: The seven-day report - net subscribers first
        run: python tools/week.py || echo "::warning::week failed - this run carried on without it"

      - name: Is anything silently dead?
        run: python tools/health.py || echo "::warning::health failed - this run carried on without it"

      - name: Read the subscribe-placement test
        run: python tools/ab_report.py || echo "::warning::ab_report failed - this run carried on without it"

      - name: Where the documentaries lose people
        run: python tools/dropoff.py || echo "::warning::dropoff failed - this run carried on without it"

      - name: Commit the reports
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git checkout -- .github/workflows 2>/dev/null || true
          git add analytics || true
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "growth: the daily reports [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              if git pull --rebase --autostash origin main && git push origin main; then
                pushed=1
                break
              fi
              sleep $((5 * i))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::the reports were written but never reached the repo"
              exit 1
            fi
          fi
