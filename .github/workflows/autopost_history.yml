name: History That Explains the World - Shorts

on:
  schedule:
    # 10 videos a day: 5 runs of 2. Every one is a different script -
    # the rotation is anchored to a fixed origin and the bank grows
    # daily, so nothing repeats. History That Explains the World - steady through the day.
    - cron: "0 12 * * *"   # 8am ET
    - cron: "0 14 * * *"   # 10am ET
    - cron: "0 17 * * *"   # 1pm ET
    - cron: "0 20 * * *"   # 4pm ET
    - cron: "0 23 * * *"   # 7pm ET
  workflow_dispatch:
    inputs:
      count:
        description: "How many history Shorts to make/upload"
        required: false
        default: "2"
      dry_run:
        description: "Build only, do not upload"
        required: false
        default: "false"

concurrency:
  group: history-shorts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet edge-tts pillow

      - name: Generate + upload history Shorts
        working-directory: autopilot_history
        env:
          YT_REFRESH_TOKEN_HISTORY: ${{ secrets.YT_REFRESH_TOKEN_HISTORY }}
          YT_PRIVACY: public
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          COUNT: ${{ github.event.inputs.count || '2' }}
          RUNS_PER_DAY: "5"
        run: python main_history.py
