name: History That Explains the World - Shorts

on:
  schedule:
    # Three a day, not ten. YouTube's inauthentic-content policy targets
    # exactly this shape - templated, replicable at scale - and in January
    # 2026 an enforcement wave removed 4.7 billion views across channels
    # doing it. Shorts stay as a discovery funnel only; the money is in the
    # long-form, which is where the volume moved.
    - cron: "0 12 * * *"   # 8am ET
    - cron: "0 0 * * *"   # moved by growth/schedule.py on 2026-09-15: 17 UTC measured 153 views against 00 at 516.5
    - cron: "0 2 * * *"    # was 23 UTC. Measured on uploads that actually landed
                           # between 14 September and 6 October: 02-06 UTC took a
                           # median of 200-270 views, 00-01 UTC took 56-65. Runs
                           # queue an hour or two behind their cron, so a 23 UTC
                           # start was landing in the worst window of the day.
    - cron: "0 4 * * *"    # added 2026-10-13: the sixth slot, and it goes to the
                           # one channel that is growing. History takes a median
                           # of 152 views a Short against Rise's 6 and FaRu's 15,
                           # on the same quota.
    - cron: "0 1 * * *"    # added 2026-09-18: 01 UTC measured 389 median views; History is the channel that is growing
    - cron: "0 16 * * *"   # added 2026-09-18: 16 UTC measured 332 median views
    - cron: "0 3 * * *"    # added 2026-10-15. 19 of History's 98 Shorts since
                           # 14 September were picked up by the feed and took a
                           # median of 907 views; FaRu Fact managed 3 of 160.
                           # Nothing measurable separates a 900-view video here
                           # from a 63-view one - same length, same retention,
                           # same words - so which one breaks out cannot be
                           # chosen, only how many attempts are made where
                           # attempts land. These two slots come off Rise.
    - cron: "0 6 * * *"    # added 2026-10-15: 06 UTC measured 256 median views
  workflow_dispatch:
    inputs:
      count:
        description: "How many history Shorts to make/upload"
        required: false
        default: "2"
      dry_run:
        description: "Build only, do not upload"
        required: false
        default: "false"

concurrency:
  group: history-shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet edge-tts pillow piper-tts

      - name: Generate + upload history Shorts
        working-directory: autopilot_history
        env:
          YT_REFRESH_TOKEN_HISTORY: ${{ secrets.YT_REFRESH_TOKEN_HISTORY }}
          YT_PRIVACY: public
          YT_REFRESH_TOKEN_CAPTIONS: ${{ secrets.YT_REFRESH_TOKEN_MANAGE_HISTORY }}   # force-ssl: subtitles
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          RUNS_PER_DAY: "3"
        run: python main_history.py

      # The ledger is how a repeat is prevented when the shared API quota runs
      # out and the channel cannot be read. It only works if it survives the
      # run, so it is committed back.
      - name: Record what was published
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "faru-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          # The subscribe-placement arms too. record_arm() writes them on the
          # runner and printed "subscribe test: early arm" for eight days
          # while nothing committed them, so the test had no record of a
          # single video and the report kept saying "nothing assigned yet".
          git add autopilot_*/published_*.json analytics/ab_subscribe_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          git commit -m "ledger: record published titles [skip ci]"
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true; git merge --abort 2>/dev/null || true; git pull --rebase --autostash --quiet origin main && git push --quiet origin main && exit 0
            sleep 7
          done
          echo "could not push the ledger"

      - name: Release the post pack (TikTok / Reels files)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(autopilot_history/_work/pack/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing packed this run"
            exit 0
          fi
          tag="pack-history-$(date -u +%Y%m%d-%H%M%S)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" "${files[@]}" \
            --title "History Explains Shorts - $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "Vertical videos with their captions, ready to post to TikTok, Instagram Reels and Facebook Reels. Same videos as the YouTube uploads from this run."

      - name: Cross-post to Instagram and Facebook Reels
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ -z "$IG_USER_ID" ] && [ -z "$FB_PAGE_ID" ]; then
            echo "no Instagram or Facebook credentials set - skipping"
            exit 0
          fi
          shopt -s nullglob
          for mp4 in autopilot_history/_work/pack/*.mp4; do
            base="${mp4%.mp4}"
            name="$(basename "$mp4")"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
            python tools/crosspost_meta.py --video-url "$url" --caption-file "$base.txt" || echo "::warning::crosspost_meta failed - this run carried on without it"
          done

      - name: Keep the dry-run video to inspect
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-short
          path: autopilot_history/_work/final.mp4
          if-no-files-found: warn
          retention-days: 3
